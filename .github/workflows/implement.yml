name: Implement spec PR

# A dev pushes spec changes to a PR; the agent (currently Claude) implements them on the same branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["openspec/**"]

concurrency:
  group: implement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  implement:
    # Devs' pushes start a run; bot pushes (the agent's) never do, so no loops.
    # Only branches in this repo, i.e. people with write access, not forks.
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - id: cred
        run: echo "ok=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.cred.outputs.ok != 'true'
        run: echo "::notice::No agent credential configured yet; see the owner-task issues."

      - uses: actions/checkout@v6
        if: steps.cred.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: 22

      - if: steps.cred.outputs.ok == 'true'
        run: npm install -g @fission-ai/openspec@1

      - uses: anthropics/claude-code-action@v1
        if: steps.cred.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Implement spec PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Branch: ${{ github.event.pull_request.head.ref }} (base: ${{ github.event.pull_request.base.ref }}).
            Follow "Implementing a spec PR" in AGENTS.md exactly, including the final
            comment and label. Push commits to this branch; do not open a new PR.
          claude_args: |
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch,WebSearch"
