name: Copilot Setup Steps

# Prepares the Copilot cloud agent's environment before each task, so it
# doesn't spend its own time installing tools. Runs on changes for validation.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Copilot only picks up a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify pinned Wrangler
        run: npm exec -- wrangler --version

      - name: Clone Button Men upstream for reference (see AGENTS.md)
        run: git clone --depth 1 https://github.com/buttonmen-dev/buttonmen /tmp/buttonmen

      - name: Check the starting point
        run: npm test && openspec validate --all --strict --no-interactive
