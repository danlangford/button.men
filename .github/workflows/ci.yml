name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate specs
        run: npx -y @fission-ai/openspec@1 validate --all --strict --no-interactive

      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci

      # The lock only vouches for itself; this re-derives /bot from the release it names.
      - name: Verify /bot is the published BMAIR release
        if: hashFiles('bot.lock.json') != ''
        run: node scripts/update-bot.js --verify
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint

      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test

      - name: Install Playwright browsers
        if: hashFiles('package.json') != ''
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        if: hashFiles('package.json') != ''
        run: npm run test:browser
