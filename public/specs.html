<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Specifications - button.men</title>
  <script>
    (() => {
      let choice = "auto";
      try { choice = localStorage.getItem("theme") || "auto"; } catch {}
      const dark = choice === "dark" || (choice === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.bsTheme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    details { scroll-margin-top: 1rem; }
  </style>
</head>
<body>
  <nav class="navbar border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">button.men</a>
      <a href="/" class="btn btn-sm btn-outline-primary">Back to button.men</a>
    </div>
  </nav>
  <main class="container py-4">
    <h1 class="h3">Specifications</h1>
    <p class="text-body-secondary">Browse features or search across all specifications.</p>
    <label for="spec-search" class="form-label">Search specifications</label>
    <input id="spec-search" class="form-control mb-3" type="search" autocomplete="off">
    <nav id="spec-index" aria-label="Specification features" class="d-flex flex-wrap gap-2 mb-3"></nav>
    <p id="spec-status" class="small text-body-secondary" role="status" aria-live="polite"></p>
    <section id="spec-list" aria-label="Feature specifications"></section>
  </main>
  <script type="module" src="/js/specs.js"></script>
</body>
</html>
