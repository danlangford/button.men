<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>button.men</title>
  <script>
    // Set the theme before first paint; public/js/theme.js has the same rules.
    (() => {
      let choice = "auto";
      try { choice = localStorage.getItem("theme") || "auto"; } catch {}
      const dark = choice === "dark" || (choice === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.bsTheme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <nav class="navbar border-bottom">
    <div class="container d-flex flex-wrap gap-2">
      <span class="navbar-brand fw-bold">button.men</span>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <span id="player" class="text-body-secondary"></span>
        <select id="theme" class="form-select form-select-sm w-auto" aria-label="Theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <button id="logout" class="btn btn-sm btn-outline-secondary" type="button" hidden>Log out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="error" class="alert alert-danger" role="alert" hidden></div>

    <section id="login-view" hidden>
      <div class="mx-auto" style="max-width: 24rem">
        <h1 class="h4 mb-3">Log in with your buttonweavers account</h1>
        <form id="login-form">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" name="username" class="form-control" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="small mt-3"><a id="transparency-link" href="/about">What passes through button.men, and what's never kept</a></p>
      </div>
    </section>

    <section id="games-view" hidden>
      <h1 class="h4 mb-3">Your games</h1>
      <p id="no-games" class="text-body-secondary" hidden>No active games.</p>
      <div id="games" class="list-group"></div>
      <p class="small text-body-secondary mt-3">Games open on buttonweavers.com.</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
