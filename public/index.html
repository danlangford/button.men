<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>button.men</title>
  <script>
    // Set the theme before first paint; public/js/theme.js has the same rules.
    (() => {
      let choice = "auto";
      try { choice = localStorage.getItem("theme") || "auto"; } catch {}
      const dark = choice === "dark" || (choice === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.bsTheme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .forum-post-body { white-space: pre-wrap; }
    .navbar-controls { min-width: 0; }
    @media (max-width: 575.98px) {
      main { min-width: 0; overflow-wrap: anywhere; }
      .navbar-controls {
        flex: 1 1 100%;
        justify-content: flex-start;
        margin-left: 0 !important;
      }
      .navbar-player {
        flex-basis: 100%;
        overflow-wrap: anywhere;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar border-bottom">
    <div class="container d-flex flex-wrap gap-2">
      <a class="navbar-brand fw-bold" href="#games">button.men</a>
      <div class="navbar-controls d-flex flex-wrap align-items-center gap-2 ms-auto">
        <a class="btn btn-sm btn-outline-primary" href="/specs/">Specifications</a>
        <span id="player" class="navbar-player text-body-secondary"></span>
        <a id="forum-link" href="#!" class="btn btn-sm btn-outline-primary" hidden>Forum</a>
        <a id="search-link" href="#search" class="btn btn-sm btn-outline-primary" hidden>Search</a>
        <a id="games-link" href="#games" class="btn btn-sm btn-outline-primary" hidden>Games</a>
        <select id="theme" class="form-select form-select-sm w-auto" aria-label="Theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <button id="logout" class="btn btn-sm btn-outline-secondary" type="button" hidden>Log out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="error" class="alert alert-danger" role="alert" hidden></div>

    <section id="login-view" hidden>
      <div class="mx-auto" style="max-width: 24rem">
        <h1 class="h4 mb-3">Log in with your buttonweavers account</h1>
        <form id="login-form">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" name="username" class="form-control" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="small mt-3"><a id="transparency-link" href="/about">What passes through button.men, and what's never kept</a></p>
      </div>
    </section>

    <section id="games-view" hidden>
      <h1 class="h4 mb-3">Your games</h1>
      <p id="no-games" class="text-body-secondary" hidden>No active games.</p>
      <div id="games" class="list-group"></div>
      <p class="small text-body-secondary mt-3">Games open on buttonweavers.com.</p>
    </section>

    <section id="forum-view" hidden>
      <div id="forum-content"></div>
    </section>

    <section id="search-view" hidden>
      <h1 class="h4 mb-3">Search games</h1>
      <form id="search-form" class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <label for="search-gameId" class="form-label">Game ID</label>
          <input id="search-gameId" name="gameId" type="number" min="1" class="form-control">
        </div>
        <div class="col-6 col-md-3">
          <label for="search-status" class="form-label">Status</label>
          <select id="search-status" name="status" class="form-select">
            <option value="">Any</option>
            <option value="ACTIVE">Active</option>
            <option value="UNSTARTED">Unstarted</option>
            <option value="COMPLETE">Complete</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label for="search-winningPlayer" class="form-label">Winner</label>
          <select id="search-winningPlayer" name="winningPlayer" class="form-select">
            <option value="">Any</option>
            <option value="A">Player</option>
            <option value="B">Opponent</option>
            <option value="Tie">Tie</option>
          </select>
        </div>
        <div class="col-6 col-md-3"></div>
        <div class="col-6 col-md-3">
          <label for="search-playerNameA" class="form-label">Player</label>
          <input id="search-playerNameA" name="playerNameA" class="form-control">
        </div>
        <div class="col-6 col-md-3">
          <label for="search-buttonNameA" class="form-label">Button</label>
          <input id="search-buttonNameA" name="buttonNameA" class="form-control">
        </div>
        <div class="col-6 col-md-3">
          <label for="search-playerNameB" class="form-label">Opponent</label>
          <input id="search-playerNameB" name="playerNameB" class="form-control">
        </div>
        <div class="col-6 col-md-3">
          <label for="search-buttonNameB" class="form-label">Opponent's button</label>
          <input id="search-buttonNameB" name="buttonNameB" class="form-control">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Game started</label>
          <div class="d-flex gap-2">
            <input name="gameStartFrom" type="date" class="form-control" aria-label="Game started from">
            <input name="gameStartTo" type="date" class="form-control" aria-label="Game started to">
          </div>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label">Last move</label>
          <div class="d-flex gap-2">
            <input name="lastMoveFrom" type="date" class="form-control" aria-label="Last move from">
            <input name="lastMoveTo" type="date" class="form-control" aria-label="Last move to">
          </div>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Search</button>
        </div>
      </form>
      <div id="search-results"></div>
      <p class="small text-body-secondary mt-3">Results open on buttonweavers.com.</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
